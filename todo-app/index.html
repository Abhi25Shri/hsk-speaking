<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 My Todo List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <div class="todo-input-section">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Add a new task..." 
                    class="todo-input"
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">➕ Add</button>
            </div>
            <div class="priority-wrapper">
                <label for="prioritySelect">Priority:</label>
                <select id="prioritySelect" class="priority-select">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="high">High Priority</button>
            <button id="clearCompleted" class="filter-btn clear-btn">🗑️ Clear Completed</button>
        </div>

        <div class="stats-section">
            <div class="stat">
                <span class="stat-label">Total:</span>
                <span class="stat-value" id="totalCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Completed:</span>
                <span class="stat-value completed" id="completedCount">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Remaining:</span>
                <span class="stat-value remaining" id="remainingCount">0</span>
            </div>
        </div>

        <div class="sort-section">
            <label for="sortSelect">Sort by:</label>
            <select id="sortSelect" class="sort-select">
                <option value="date-desc">Newest First</option>
                <option value="date-asc">Oldest First</option>
                <option value="priority">Priority</option>
                <option value="alphabetical">Alphabetical</option>
            </select>
        </div>

        <ul id="todoList" class="todo-list">
            <!-- Todo items will be added here -->
        </ul>

        <div id="emptyState" class="empty-state">
            <p>✨ No tasks yet. Start by adding one!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
